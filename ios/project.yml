# XcodeGen-Spezifikation.
#
# Bewusst kein eingecheckter .xcodeproj-Ordner: der ist unlesbar im Diff
# und kollidiert bei jeder Aenderung. Stattdessen:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# Voraussetzung: build/scripts/build-ios.sh core wurde bereits ausgefuehrt
# und hat libpsmobile_core.a erzeugt.

name: PSMobile
options:
  bundleIdPrefix: de.psmobile
  # 16.0 statt 15.0: NavigationStack gibt es erst ab 16, und die Geraete,
  # die dazwischen liegen - iPhone 7, iPad Air 2, iPad mini 4 - haben zum
  # Slicen ohnehin zu wenig Arbeitsspeicher. Die urspruengliche Begruendung
  # fuer 15.0 ("deckt alles ab, was genug RAM hat") gilt fuer 16.0 genauso.
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OBJC_BRIDGING_HEADER: PSMobile/Support/PSMobile-Bridging-Header.h
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../core/include
    # Beide Plattformen stehen hier, nicht nur das Geraet: sonst faende
    # der Linker beim Simulatorbau nichts und meldete das als Haufen
    # fehlender Symbole statt als fehlenden Pfad - eine Fehlersuche, die
    # in die falsche Richtung fuehrt. Nicht vorhandene Pfade ignoriert
    # Xcode, es steht also immer nur die tatsaechlich gebaute Plattform
    # zur Verfuegung.
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/../build-out/ios-core-OS64
      - $(SRCROOT)/../build-out/ios-destdir-OS64/usr/local/lib
      - $(SRCROOT)/../build-out/ios-core-SIMULATORARM64
      - $(SRCROOT)/../build-out/ios-destdir-SIMULATORARM64/usr/local/lib

targets:
  PSMobile:
    type: application
    platform: iOS
    sources:
      - path: PSMobile
    resources:
      # Die PrusaSlicer-Profile werden ins Bundle gelegt und beim ersten
      # Start von PsmCore gelesen. Der Ordner wird von
      # build/scripts/stage-resources.sh befuellt.
      - path: Resources/psresources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: PSMobile/Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: de.psmobile
        # Ohne diesen Namen heisst das Ergebnis woertlich ".app", und
        # xcodebuild bricht mit "Multiple commands produce ... /.app" ab -
        # das klingt nach zwei kollidierenden Zielen und ist doch nur ein
        # fehlender Name.
        PRODUCT_NAME: PSMobile
        # 1 = iPhone, 2 = iPad. Ohne beides laeuft die App auf dem iPad im
        # iPhone-Fenster mitten auf schwarzem Grund - sie startet, sieht
        # aber aus wie ein Fehler. Das iPad ist das eigentliche Ziel.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Der Kern ist C++ - ohne libc++ fehlen beim Linken alle Symbole.
        OTHER_LDFLAGS:
          - -lc++
          # Die zusammengefasste Fassung, nicht libpsmobile_core allein:
          # darin stecken libslic3r und alle Dependencies. Erzeugt von
          # build/scripts/build-ios.sh.
          - -lpsmobile_core_all
    dependencies:
      - sdk: OpenGLES.framework
      - sdk: Metal.framework
