# iOS auf einem gemieteten macOS-Laeufer bauen.
#
# Der zweite Weg neben einem selbst gemieteten Mac: GitHub stellt echte
# Apple-Hardware, man zahlt nach Minute und braucht kein Geraet vor Ort.
#
# Zwei Ziele, die sich nicht ersetzen:
#
#   simulator  laeuft nur im iPad-Simulator auf dem Laeufer. Ergebnis
#              sind Screenshots - der schnelle Blick auf die Oberflaeche.
#
#   device     unsignierte .ipa fuer ein echtes iPad. Sie laesst sich
#              mit Sideloadly oder AltStore vom Windows-Rechner aus
#              aufspielen, dabei wird sie mit der eigenen Apple-ID
#              signiert. Kein Mac noetig, auch nicht zum Installieren.
#
# Voraussetzung: das Repo liegt auf GitHub. Bisher liegt es nur lokal.
#
# Bewusst manuell ausgeloest: der Dependency-Bau dauert Stunden, und
# macOS-Minuten sind teuer.

name: iOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was gebaut werden soll"
        type: choice
        options: [simulator, device, both]
        default: simulator
      rebuild_deps:
        description: "Dependencies von vorn bauen statt fortzusetzen"
        type: boolean
        default: false
      deps_minutes:
        description: "Zeitfenster fuer den Dependency-Bau in Minuten"
        default: "150"

jobs:
  simulator:
    if: inputs.target == 'simulator' || inputs.target == 'both'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      PSM_IOS_PLATFORM: SIMULATORARM64
      DEPS_KEY: ios-deps-simarm64-${{ hashFiles('patches/*.patch', 'build/scripts/build-ios.sh') }}

    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          # coreutils wegen gtimeout - macOS bringt kein timeout mit.
          brew install cmake ninja xcodegen automake autoconf libtool pkg-config coreutils
          xcodebuild -version
          xcodebuild -showsdks | grep iphone

      # Fortsetzbar statt alles-oder-nichts.
      #
      # Ein kostenloses Konto hat 200 macOS-Minuten im Monat, der
      # Dependency-Bau braucht mehr. Deshalb wird nicht nur das Ergebnis
      # zwischengespeichert, sondern auch der halbfertige Bauordner - und
      # zwar auch dann, wenn das Zeitfenster ausgelaufen ist. Jeder Lauf
      # bringt einen so ein Stueck weiter, statt jedes Mal bei null zu
      # beginnen.
      #
      # Der Schluessel traegt die Laufnummer, weil ein bestehender
      # Cache-Eintrag nicht ueberschrieben werden kann. restore-keys
      # greift dann den jeweils neuesten passenden Stand.
      - name: Bisherigen Fortschritt holen
        if: '! inputs.rebuild_deps'
        uses: actions/cache/restore@v4
        with:
          path: |
            build-out/ios-deps-SIMULATORARM64
            build-out/ios-destdir-SIMULATORARM64
            build-out/dl-cache
          key: ${{ env.DEPS_KEY }}-none
          restore-keys: ${{ env.DEPS_KEY }}-

      - name: Quellen und Patches
        run: build/scripts/macos-bootstrap.sh sources

      - name: Dependencies, zeitbegrenzt
        id: deps
        run: |
          set +e
          gtimeout "${{ inputs.deps_minutes }}m" build/scripts/macos-bootstrap.sh deps
          rc=$?
          set -e
          if [ "$rc" = "124" ]; then
              echo "unfinished=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Zeitfenster ausgeschoepft. Der Fortschritt wird gesichert - einfach erneut starten."
              exit 0
          fi
          exit "$rc"

      # Auch nach einem Abbruch sichern: der halbfertige Stand ist genau
      # das, was den naechsten Lauf kuerzer macht.
      - name: Fortschritt sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build-out/ios-deps-SIMULATORARM64
            build-out/ios-destdir-SIMULATORARM64
            build-out/dl-cache
          key: ${{ env.DEPS_KEY }}-${{ github.run_id }}

      - name: Anhalten, solange die Dependencies unfertig sind
        if: steps.deps.outputs.unfinished == 'true'
        run: |
          echo "Die Dependencies sind noch nicht fertig."
          echo "Der Stand liegt im Cache. Denselben Ablauf einfach noch einmal starten -"
          echo "er setzt dort fort, wo dieser Lauf aufgehoert hat."
          exit 1

      - name: Kern
        run: build/scripts/macos-bootstrap.sh core

      - name: Ressourcen und Xcode-Projekt
        run: build/scripts/macos-bootstrap.sh project

      # Die eigentliche Frage. Dass etwas uebersetzt, heisst nicht, dass
      # es rechnet - und ein Slicer, der auf iOS zwar startet, aber
      # falschen G-Code liefert, waere schlimmer als einer, der gar nicht
      # baut. simctl spawn fuehrt das fuer den Simulator gebaute Binary
      # in der Simulatorumgebung aus, mit Zugriff auf die Dateien des
      # Laeufers - derselbe Test, der unter Android auf dem Emulator
      # laeuft.
      - name: C-ABI-Vertragstest im Simulator
        run: |
          set -eux
          TEST=$(find build-out/ios-core-SIMULATORARM64 -name psm_contract_tests -type f | head -1)
          test -n "$TEST"

          python3 build/scripts/make-test-project-3mf.py /tmp/multibed.3mf
          python3 build/scripts/make-test-project-3mf.py --installed-core-one /tmp/installed.3mf

          DEVICE=$(xcrun simctl create psm-test \
                   "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4" \
                   "com.apple.CoreSimulator.SimRuntime.iOS-18-0")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

          mkdir -p /tmp/psmdata
          xcrun simctl spawn "$DEVICE" "$PWD/$TEST" \
              /tmp/psmdata \
              "$PWD/ios/Resources/psresources" \
              "$PWD/testdata/wuerfel20.stl" \
              /tmp/multibed.3mf \
              /tmp/installed.3mf

          xcrun simctl shutdown "$DEVICE"

      - name: App fuer den Simulator bauen
        run: |
          xcodebuild -project ios/PSMobile.xcodeproj \
                     -scheme PSMobile \
                     -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M4)' \
                     -derivedDataPath build-out/ios-derived \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      # Ohne diesen Schritt haette man einen gruenen Build und trotzdem
      # keine Ahnung, wie die Oberflaeche aussieht - worum es bei einem
      # Prototyp aber gerade geht.
      - name: Im Simulator starten und Bild aufnehmen
        run: |
          set -x
          DEVICE=$(xcrun simctl create psm-ipad \
                   "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4" \
                   "com.apple.CoreSimulator.SimRuntime.iOS-18-0")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build-out/ios-derived -name 'PSMobile.app' -type d | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" de.psmobile
          sleep 25
          mkdir -p build-out/screenshots
          xcrun simctl io "$DEVICE" screenshot build-out/screenshots/ipad-start.png
          xcrun simctl shutdown "$DEVICE"

      - name: Bilder als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: build-out/screenshots/
          if-no-files-found: warn

  device:
    if: inputs.target == 'device' || inputs.target == 'both'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      PSM_IOS_PLATFORM: OS64

    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          brew install cmake ninja xcodegen automake autoconf libtool pkg-config
          xcodebuild -version

      # Eigener Cache: Geraet und Simulator sind getrennte Bauten und
      # duerfen sich ihre Dependencies nicht teilen.
      - name: Dependency-Cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            build-out/ios-destdir-OS64
            build-out/dl-cache
          key: ios-deps-os64-${{ hashFiles('patches/*.patch', 'build/scripts/build-ios.sh') }}

      - name: Quellen und Patches
        run: build/scripts/macos-bootstrap.sh sources

      - name: Dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true' || inputs.rebuild_deps
        run: build/scripts/macos-bootstrap.sh deps

      - name: Kern
        run: build/scripts/macos-bootstrap.sh core

      - name: Ressourcen und Xcode-Projekt
        run: build/scripts/macos-bootstrap.sh project

      # Unsigniert bauen. Ein Signierschluessel wuerde ein
      # Apple-Entwicklerkonto und hinterlegte Geheimnisse brauchen -
      # unnoetig, weil Sideloadly und AltStore beim Aufspielen ohnehin
      # mit der Apple-ID des Nutzers neu signieren.
      - name: App fuer das Geraet bauen
        run: |
          xcodebuild -project ios/PSMobile.xcodeproj \
                     -scheme PSMobile \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build-out/ios-derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      # Eine .ipa ist ein ZIP mit der App in einem Ordner namens Payload -
      # mehr nicht. xcodebuild -exportArchive kaeme hier nicht in Frage,
      # weil es ein Signierprofil verlangt.
      - name: Als .ipa verpacken
        run: |
          set -eux
          APP=$(find build-out/ios-derived -name 'PSMobile.app' -type d | head -1)
          test -n "$APP"
          rm -rf build-out/ipa
          mkdir -p build-out/ipa/Payload
          cp -R "$APP" build-out/ipa/Payload/
          ( cd build-out/ipa && zip -qry PSMobile-unsigned.ipa Payload )
          ls -lh build-out/ipa/PSMobile-unsigned.ipa

      - name: .ipa als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSMobile-unsigned-ipa
          path: build-out/ipa/PSMobile-unsigned.ipa
          if-no-files-found: error
